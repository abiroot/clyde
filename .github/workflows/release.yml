name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS binary (Apple Silicon + Intel).
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # release-notes/<tag>.md becomes the release's body and the "notes" in
      # latest.json, which installed copies show under "What's new".
      - name: Release notes
        id: notes
        run: |
          f="release-notes/${GITHUB_REF_NAME}.md"
          {
            echo 'body<<CLYDE_NOTES_EOF'
            if [ -f "$f" ]; then cat "$f"; fi
            echo 'CLYDE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundle; the app checks it against the public key
          # in tauri.conf.json before installing. Losing this key means
          # existing installs can't auto-update to builds signed with a new one.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # For signing/notarization, add APPLE_* secrets and they'll be used.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Clyde ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # Publishes latest.json, which installed copies poll for updates.
          includeUpdaterJson: true
          args: --target universal-apple-darwin
